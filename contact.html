<!DOCTYPE html>

    <title>Contact Me</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/contact.css" />

    />
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <body>
    <!-- Particle Background Container -->
    <div id="particles-js"></div>

    <nav>
      <div class="nav-container">

        <button class="mobile-menu-btn">☰</button>

          <li><a href="index.html">Home</a></li>

          <li><a href="publication.html">Publication</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>

    <div class="container">
      <h1 class="section-title">
        Contact <span class="text-gradient">Me</span>
      </h1>

      <!-- Contact Info and Social Media Row -->
      <div class="contact-row">
        <!-- Contact Card (Left) -->
        <div class="contact-card">
          <h2 class="contact-card-title">Contact Information</h2>
          <div class="contact-info">
            <p>
              <i class="fas fa-user"></i><strong>Name:</strong> Vikas Kumar
              Meena
            </p>
            <p>
              <i class="fas fa-envelope"></i
              ><strong>Email:</strong> ce22resch01004@iith.ac.in
            </p>
            <p>
              <i class="fas fa-address-card"></i
              ><strong>Address:</strong> Indian Institute of Technology,
              Hyderabad
            </p>
            <p>
              <i class="fas fa-map-marker-alt"></i
              ><strong>Location:</strong> India
            </p>
          </div>
        </div>

        <!-- Social Media Links (Right) -->
        <div class="social-section">
          <h2 class="social-title">Connect With Me</h2>
          <div class="social-grid">
            <a
              href="https://github.com/vikasm25"
              target="_blank"
              class="social-link github"
              title="GitHub"
            >
              <i class="fab fa-github"></i>
              <span>GitHub</span>
            </a>
            <a
              href="https://www.linkedin.com/in/vikas-kumar-m-206001194/"
              target="_blank"
              class="social-link linkedin"
              title="LinkedIn"
            >
              <i class="fab fa-linkedin-in"></i>
              <span>LinkedIn</span>
            </a>
            <a
              href="https://www.researchgate.net/profile/Vikas-Meena-16?ev=hdr_xprf"
              target="_blank"
              class="social-link researchgate"
              title="ResearchGate"
            >
              <i class="fab fa-researchgate"></i>
              <span>Research Gate</span>
            </a>
            <a
              href="https://scholar.google.com/citations?user=abpegDQAAAAJ&hl=en"
              target="_blank"
              class="social-link scholar"
              title="Google Scholar"
            >
              <i class="fab fa-google"></i>
              <span>Google Scholar</span>
            </a>
          </div>
        </div>
      </div>
    </div>

    <script src="js/particles.js"></script>
    <script>
      // Mobile menu toggle
      const menuBtn = document.querySelector(".mobile-menu-btn");
      const navLinks = document.querySelector(".nav-links");

      menuBtn.addEventListener("click", () => {
